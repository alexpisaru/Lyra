[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lyra-core"
version = "0.3.2"
description = "Lyra Core: local assistant runtime, a reduced fork of OpenJarvis, for a 2B model on Ollama"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = ["click>=8,<9", "httpx>=0.27,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "websockets>=12,<18"]
# Lyra Voice (STT + TTS on CPU). Models are downloaded separately, see docs/VOICE.md.
voice = ["faster-whisper>=1.1,<2", "piper-tts>=1.2,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.4", "build>=1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "websockets>=12,<18"]

[project.scripts]
lyra = "openjarvis.cli:main"
# Deprecated legacy alias, kept temporarily; use `lyra`.
jarvis = "openjarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjarvis"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "config", "scripts", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
