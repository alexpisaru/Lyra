# OpenJarvis Lite — CT Jarvis con browser Chromium (backend stabile, predefinito).
# Prerequisiti: pip install ".[browser]", playwright install-deps/install chromium (README).

[engine]
host = "http://192.168.1.252:11434"
model = "openbmb/minicpm5-2b:q8_0"
timeout = 120.0

[intelligence]
temperature = 0.1
max_tokens = 512
num_ctx = 8192

[agent]
max_turns = 6
max_tool_calls = 5
max_tool_output_chars = 1200
max_prompt_bytes = 12000
history_chars = 2000

[tools]
workspace = "/srv/jarvis-workspace"
enabled = ["calculator", "file_read", "memory_store", "memory_retrieve", "notes_search", "notes_read", "notes_write", "notes_append", "browser_navigate", "browser_click", "browser_type", "browser_extract"]
browser = true

[knowledge]
enabled = true
vault_path = "/srv/jarvis-vault"

[memory]
enabled = true
db_path = "/srv/jarvis-state/memory.db"

[browser]
backend = "chromium"
cdp_url = "ws://127.0.0.1:9222" # usato solo da obscura
fallback = "none"
