# Lyra — CT Lyra (Debian/Ubuntu LXC su Proxmox).
# Ollama gira in un altro CT; qui nessun modello viene scaricato.
# Browser opzionale spento: vedi docs/BROWSER.md per attivarlo.

[engine]
host = "http://192.168.1.252:11434"
model = "openbmb/minicpm5-2b:q8_0"
timeout = 120.0

[intelligence]
# Il modello è in engine.model; qui solo i parametri di generazione.
temperature = 0.1
max_tokens = 512
num_ctx = 8192

[agent]
max_turns = 6
max_tool_calls = 5
max_tool_output_chars = 1200
max_prompt_bytes = 12000
history_chars = 2000

[tools]
workspace = "/srv/lyra-workspace"
enabled = ["calculator", "file_read", "memory_store", "memory_retrieve", "notes_search", "notes_read", "notes_write", "notes_append"]
browser = false
# Per il browser: installare .[browser], browser=true e aggiungere a enabled
# "browser_navigate", "browser_click", "browser_type", "browser_extract".
# L'allowlist globale NON viene inviata al modello: un solo pack, <=5 schema.

[knowledge]
# Vault Markdown = source of truth, apribile con Obsidian. Indice FTS solo in RAM.
enabled = true
vault_path = "/srv/lyra-vault"

[memory]
# Memoria runtime SQLite/FTS5, separata e fuori dal vault.
enabled = true
db_path = "/srv/lyra-state/memory.db"

[browser]
# Chromium = stabile/predefinito. Obscura = EXPERIMENTAL (config/lite-obscura.toml).
backend = "chromium"
cdp_url = "ws://127.0.0.1:9222"
fallback = "none"
