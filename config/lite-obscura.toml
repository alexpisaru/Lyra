# Lyra — CT Lyra con browser Obscura (EXPERIMENTAL).
# Obscura v0.2.3 NON ha superato il probe di intercettazione richieste nello
# smoke Windows ed è NOT VERIFIED ON TARGET LINUX CT. Se il probe fallisce,
# Lyra rifiuta il backend: nessun bypass del guard SSRF. Vedi docs/BROWSER.md.

[engine]
host = "http://192.168.1.252:11434"
model = "openbmb/minicpm5-2b:q8_0"
timeout = 120.0
# Tiene MiniCPM in RAM tra una richiesta e l'altra (default Ollama: 5m, poi
# caricamento a freddo). Durata Ollama: "30m", "2h", "-1" = sempre, "" = default Ollama.
keep_alive = "30m"

[intelligence]
temperature = 0.1
max_tokens = 512
num_ctx = 8192

[agent]
max_turns = 6
max_tool_calls = 5
max_tool_output_chars = 1200
max_prompt_bytes = 12000
history_chars = 2000

[tools]
workspace = "/srv/lyra-workspace"
enabled = ["calculator", "file_read", "memory_store", "memory_retrieve", "notes_search", "notes_read", "notes_write", "notes_append", "browser_navigate", "browser_click", "browser_type", "browser_extract"]
browser = true

[knowledge]
enabled = true
vault_path = "/srv/lyra-vault"

[memory]
enabled = true
db_path = "/srv/lyra-state/memory.db"

[browser]
backend = "obscura"
# Solo IP loopback esplicito con porta; mai esporre la porta CDP in LAN.
cdp_url = "ws://127.0.0.1:9222"
# "none": se Obscura fallisce, errore esplicito.
# "chromium": ripiego SOLO all'avvio, con RuntimeWarning e backend/motivo nei metadati
# (richiede Chromium installato come per il backend stabile).
fallback = "none"

[api]
# `lyra api` (HTTP + WebSocket, docs/API.md). Default: solo localhost.
# Per LAN/Tailscale: host = "0.0.0.0" + api_key. Mai esporre la porta su Internet.
enabled = true
host = "127.0.0.1"
port = 8787
api_key = ""           # vuota = nessuna auth; es. python3 -c "import secrets; print(secrets.token_urlsafe(32))"
allowed_origins = []   # origin esatti per una GUI su altro host; mai "*"
